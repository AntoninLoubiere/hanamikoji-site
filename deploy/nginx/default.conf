server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
    }

    # Static assets are built by collectstatic in the web container.
    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 7d;
    }

    # Public replay files.
    location ~ ^/media/match/([0-9]+)/(map.txt|dump.json)$ {
        alias /media/match/$1/$2;
    }

    # Play game files (replay, map, output).
    location ~ ^/media/play/([^/]+)/(dump.json|map.txt|out.txt)$ {
        alias /media/play/$1/$2;
    }

    location /media/ {
        alias /media/;
        access_log off;
        expires 1d;
        internal;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
