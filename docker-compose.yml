services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-hanamikoji}
      POSTGRES_USER: ${DB_USER:-hanamikoji}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hanamikoji} -d ${DB_NAME:-hanamikoji}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python3 manage.py migrate && python3 manage.py collectstatic --noinput && make -C /app/game/user_champion champion.so && (python3 manage.py createsuperuser --noinput || true) && python3 manage.py cleanup && daphne -b 0.0.0.0 -p 8000 website.asgi:application"
    env_file:
      - .env
    privileged: true
    volumes:
      - ./website:/app
      - static_data:/app/staticfiles
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-developpement}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-website.settings}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-change-me}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
      DB_NAME: ${DB_NAME:-hanamikoji}
      DB_USER: ${DB_USER:-hanamikoji}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      MATCH_RULES: ${MATCH_RULES:-/usr/lib64/libhanamikoji.so}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/staticfiles:ro
      - ./website/codes:/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    profiles:
      - manual

  certbot-renew:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet || true; sleep 12h & wait $$!; done'
    restart: unless-stopped

  qcluster:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python3 manage.py migrate && python3 manage.py qcluster"
    env_file:
      - .env
    privileged: true
    volumes:
      - ./website:/app
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-developpement}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-website.settings}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-change-me}
      DB_NAME: ${DB_NAME:-hanamikoji}
      DB_USER: ${DB_USER:-hanamikoji}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      MATCH_RULES: ${MATCH_RULES:-/usr/lib64/libhanamikoji.so}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  static_data:
  certbot_www:
  certbot_certs:
